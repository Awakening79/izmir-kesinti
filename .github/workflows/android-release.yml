name: Android Release AAB (Play Store)

# Triggered manually — fill in the keystore secrets in GitHub first
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (integer, increment each release)"
        required: true
        default: "1"

jobs:
  build-release-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web app
        run: pnpm --filter @workspace/izmir-elektrik run build

      - name: Add Capacitor Android platform
        working-directory: artifacts/izmir-elektrik
        run: npx cap add android

      - name: Apply Android config overrides
        working-directory: artifacts/izmir-elektrik
        run: |
          cp android-overrides/app/src/main/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml
          cp android-overrides/app/src/main/res/values/styles.xml \
             android/app/src/main/res/values/styles.xml
          cp android-overrides/app/src/main/res/values/colors.xml \
             android/app/src/main/res/values/colors.xml
          mkdir -p android/app/src/main/res/values-night
          cp android-overrides/app/src/main/res/values-night/styles.xml \
             android/app/src/main/res/values-night/styles.xml

      - name: Capacitor sync
        working-directory: artifacts/izmir-elektrik
        run: npx cap sync android

      # Decode the base64-encoded keystore stored as a GitHub secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/izmir-elektrik/android/keystore.jks

      - name: Make gradlew executable
        working-directory: artifacts/izmir-elektrik/android
        run: chmod +x gradlew

      # Build signed AAB for Google Play
      - name: Build release AAB
        working-directory: artifacts/izmir-elektrik/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionName=${{ github.event.inputs.version_name }} \
            -PversionCode=${{ github.event.inputs.version_code }} \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: izmir-kesinti-takibi-release-${{ github.event.inputs.version_name }}
          path: artifacts/izmir-elektrik/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error
