name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # ── 3. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Gradle ausführbar machen ──────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/izmir-elektrik/android
        run: chmod +x gradlew

      # ── 5. Debug APK bauen ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/izmir-elektrik/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 6. APK hochladen ─────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izmir-kesinti-takibi-debug-${{ github.run_number }}
          path: artifacts/izmir-elektrik/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
