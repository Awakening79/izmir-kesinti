name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm (versteht catalog: URLs — npm tut es nicht) ──────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Install dependencies
        working-directory: artifacts/izmir-elektrik
        run: pnpm install --no-frozen-lockfile

      # ── 4. cap sync android (generiert cordova-plugins & config-Dateien) ─────
      - name: Capacitor sync
        working-directory: artifacts/izmir-elektrik
        run: npx cap sync android

      # ── 5. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # ── 6. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 7. Gradle ausführbar machen ──────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/izmir-elektrik/android
        run: chmod +x gradlew

      # ── 8. Debug APK bauen ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/izmir-elektrik/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 9. APK hochladen ─────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izmir-kesinti-takibi-debug-${{ github.run_number }}
          path: artifacts/izmir-elektrik/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
