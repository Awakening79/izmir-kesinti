name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 4. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # ── 5. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Web-App bauen (npm run build) ─────────────────────────────────────
      - name: Build web app (Vite)
        working-directory: artifacts/izmir-elektrik
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: "production"
        run: pnpm run build

      # ── 7. cap add android (nur wenn android/ nicht existiert) ───────────────
      - name: Add Capacitor Android platform
        working-directory: artifacts/izmir-elektrik
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not found — running cap add android"
            npx cap add android
          else
            echo "android/ already exists — skipping cap add"
          fi

      # ── 8. Android-Overrides anwenden ────────────────────────────────────────
      - name: Apply Android config overrides
        working-directory: artifacts/izmir-elektrik
        run: |
          cp android-overrides/app/src/main/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml
          cp android-overrides/app/src/main/res/values/styles.xml \
             android/app/src/main/res/values/styles.xml
          cp android-overrides/app/src/main/res/values/colors.xml \
             android/app/src/main/res/values/colors.xml
          mkdir -p android/app/src/main/res/values-night
          cp android-overrides/app/src/main/res/values-night/styles.xml \
             android/app/src/main/res/values-night/styles.xml

      # ── 9. cap sync android ──────────────────────────────────────────────────
      - name: Capacitor sync
        working-directory: artifacts/izmir-elektrik
        run: npx cap sync android

      # ── 10. Gradle ausführbar machen ─────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/izmir-elektrik/android
        run: chmod +x gradlew

      # ── 11. Debug APK bauen ──────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/izmir-elektrik/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 12. APK hochladen ────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izmir-kesinti-takibi-debug-${{ github.run_number }}
          path: artifacts/izmir-elektrik/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
