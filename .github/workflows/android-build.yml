name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Install dependencies
        working-directory: artifacts/izmir-elektrik
        run: pnpm install --no-frozen-lockfile

      # ── 4. Verzeichnisse anlegen & cap sync ──────────────────────────────────
      - name: Create required Android directories
        run: |
          mkdir -p artifacts/izmir-elektrik/android/app/src/main/assets
          mkdir -p artifacts/izmir-elektrik/android/app/src/main/res/values
          mkdir -p artifacts/izmir-elektrik/android/app/src/main/res/values-night

      - name: Capacitor sync
        working-directory: artifacts/izmir-elektrik
        run: npx cap sync android

      # ── 5. Android-Overrides anwenden (Farben, Styles, Manifest) ─────────────
      - name: Apply Android config overrides
        working-directory: artifacts/izmir-elektrik
        run: |
          cp android-overrides/app/src/main/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml
          cp android-overrides/app/src/main/res/values/styles.xml \
             android/app/src/main/res/values/styles.xml
          cp android-overrides/app/src/main/res/values/colors.xml \
             android/app/src/main/res/values/colors.xml
          cp android-overrides/app/src/main/res/values-night/styles.xml \
             android/app/src/main/res/values-night/styles.xml

      # ── 6. Java 21 ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      # ── 7. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 8. Gradle ausführbar machen ──────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/izmir-elektrik/android
        run: chmod +x gradlew

      # ── 9. Debug APK bauen ───────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/izmir-elektrik/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. APK hochladen ────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izmir-kesinti-takibi-debug-${{ github.run_number }}
          path: artifacts/izmir-elektrik/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
